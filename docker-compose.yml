services:
  mysql:
    image: mysql:8.0
    container_name: kalshi_mysql
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=25
      - --table-open-cache=200
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-signal_logger}
      MYSQL_USER: ${MYSQL_USER:-logger_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logger_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  logger:
    build: .
    container_name: kalshi_logger
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
